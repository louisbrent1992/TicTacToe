<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Play the classic Tic Tac Toe game with a stunning modern design. Challenge a friend in this beautifully crafted two-player experience." />
  <meta name="keywords" content="tic tac toe, game, puzzle, two player, strategy" />
  <meta name="author" content="Louis Brent" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="Tic Tac Toe - The Ultimate Showdown" />
  <meta property="og:description"
    content="A beautifully designed Tic Tac Toe game with stunning visuals and smooth animations." />
  <meta property="og:type" content="website" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#0a0a1a" />

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Favicon -->
  <link rel="icon" href="/images/x-icon.png" type="image/png" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Script -->
  <script src="script.js" defer></script>

  <title>Tic Tac Toe | The Ultimate Showdown</title>
</head>

<body>
  <!-- Header Section -->
  <header class="header" role="banner">
    <h1>Tic Tac Toe</h1>
  </header>

  <!-- Play Now Button Section -->
  <section class="container play-now" id="container" aria-label="Start game">
    <button id="playButton" aria-label="Start playing Tic Tac Toe">
      Play Now
    </button>
  </section>

  <!-- Game Board Section -->
  <main class="board" id="board" role="main" aria-label="Tic Tac Toe game board">
    <div class="cell" data-cell aria-label="Cell 1" tabindex="0"></div>
    <div class="cell" data-cell aria-label="Cell 2" tabindex="0"></div>
    <div class="cell" data-cell aria-label="Cell 3" tabindex="0"></div>
    <div class="cell" data-cell aria-label="Cell 4" tabindex="0"></div>
    <div class="cell" data-cell aria-label="Cell 5" tabindex="0"></div>
    <div class="cell" data-cell aria-label="Cell 6" tabindex="0"></div>
    <div class="cell" data-cell aria-label="Cell 7" tabindex="0"></div>
    <div class="cell" data-cell aria-label="Cell 8" tabindex="0"></div>
    <div class="cell" data-cell aria-label="Cell 9" tabindex="0"></div>
  </main>

  <!-- Winning Message Overlay -->
  <div class="winning-message" id="winningMessage" role="dialog" aria-modal="true" aria-labelledby="winning-text">
    <div id="winning-text" data-winning-message-text></div>
    <button id="restartButton" aria-label="Restart the game">Play Again</button>
  </div>
</body>

</html>
